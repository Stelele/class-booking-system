name: deploy
on:
  workflow_dispatch:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      # ephemeral local state: our Commands re-run idempotently every deploy
      PULUMI_BACKEND_URL: file://${{ github.workspace }}/infra/.pulumi-state
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_PASSPHRASE }}
      DOMAIN: lessons.giftmugweni.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: pulumi/setup-pulumi@v2
      - name: prepare ephemeral local state
        run: mkdir -p ${{ github.workspace }}/infra/.pulumi-state
      - name: init stack
        working-directory: infra
        run: |
          pulumi stack init prod --non-interactive || true
          pulumi config set class-booking:domain lessons.giftmugweni.com
          pulumi stack select prod --non-interactive
      - name: pulumi up
        working-directory: infra
        run: pulumi up --stack prod --yes --non-interactive
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DO_USER: ${{ secrets.DO_USER }}
          DO_SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          GH_OWNER: ${{ github.repository_owner }}
          FIXED_MEET_LINK: ${{ secrets.FIXED_MEET_LINK }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_KEY_ID: ${{ secrets.R2_KEY_ID }}
          R2_SECRET: ${{ secrets.R2_SECRET }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
          EMAIL_FROM: no-reply@giftmugweni.com
          TEACHER_EMAIL: ${{ secrets.TEACHER_EMAIL }}
          STUDENT_A_EMAIL: ${{ secrets.STUDENT_A_EMAIL }}
          STUDENT_B_EMAIL: ${{ secrets.STUDENT_B_EMAIL }}
