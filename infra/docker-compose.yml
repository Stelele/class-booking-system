services:
  backend:
    image: ghcr.io/${GH_OWNER}/class-booking-backend:${TAG:-latest}
    restart: unless-stopped
    # 1GB droplet shared with other apps: cap our footprint so the .NET GC
    # sizes its heap to the cgroup instead of assuming it owns the machine.
    # Without this the backend grew until the OOM killer took it (exit 137).
    mem_limit: 384m
    mem_reservation: 192m
    healthcheck:
      # runtime image has no wget/curl: bash /dev/tcp proves Kestrel is listening
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8080'"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - App__DbPath=/app/data/booking.db
      - App__FixedMeetLink=${FIXED_MEET_LINK}
      - App__Meet__Provider=${MEET_PROVIDER:-fixed}
      - Google__ClientId=${GOOGLE_CLIENT_ID}
      - Google__ClientSecret=${GOOGLE_CLIENT_SECRET}
      - Google__RedirectUri=${GOOGLE_REDIRECT_URI}
      - Google__TokenKey=${GOOGLE_TOKEN_KEY}
      - Twilio__AccountSid=${TWILIO_ACCOUNT_SID}
      - Twilio__AuthToken=${TWILIO_AUTH_TOKEN}
      - Twilio__FromNumber=${TWILIO_FROM_NUMBER}
      - Reminder__Monday=${REMINDER_MONDAY:-true}
      - Reminder__Morning=${REMINDER_MORNING:-true}
      - Reminder__Evening=${REMINDER_EVENING:-true}
      - Reminder__Confirmations=${REMINDER_CONFIRMATIONS:-true}
      - R2__AccountId=${R2_ACCOUNT_ID}
      - R2__AccessKeyId=${R2_KEY_ID}
      - R2__SecretAccessKey=${R2_SECRET}
      - R2__Bucket=${R2_BUCKET}
      - Email__Http__ApiKey=${EMAIL_API_KEY}
      - Email__Http__From=${EMAIL_FROM}
      - App__Users__0__Email=${TEACHER_EMAIL}
      - App__Users__1__Email=${STUDENT_A_EMAIL}
      - App__Users__2__Email=${STUDENT_B_EMAIL}
    volumes:
      - booking-data:/app/data

  frontend:
    image: ghcr.io/${GH_OWNER}/class-booking-frontend:${TAG:-latest}
    restart: unless-stopped
    mem_limit: 64m
    mem_reservation: 32m
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - backend

volumes:
  booking-data:
