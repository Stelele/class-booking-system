server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }
    # The entry document, the SW and its registration script all name or carry
    # the *current* build. They must be revalidated on every load, never served
    # from a browser cache that outlives a deploy — a stale index.html is what
    # asks for chunks this build never produced.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }

    # Build output is content-hashed, so a given name never changes meaning.
    # A MISS must be a 404 and must never fall through to the SPA fallback
    # below: serving index.html for a stale chunk hands the browser 200
    # text/html where it required a module script, and the lazy route dies
    # with "Failed to fetch dynamically imported module".
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
    location / { try_files $uri $uri/ /index.html; }
}
